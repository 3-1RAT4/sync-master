[project]
name = "sync-master"
version = "0.1.0b1"
description = "AI-orchestrated multi-source sync pipeline"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langchain-openai>=0.2",
    "youtube-transcript-api>=0.6",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "spotipy>=2.24",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
whisper = [
    "openai-whisper>=20231117",
]
diarization = [
    "pyannote.audio>=3.1",
]

[project.scripts]
sync-master = "sync_master.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
